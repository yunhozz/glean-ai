services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ai_brief
      POSTGRES_USER: ai_brief
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_brief"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ai_brief:${POSTGRES_PASSWORD:-local-only-password}@db:5432/ai_brief
    depends_on:
      db:
        condition: service_healthy
    command: ["health"]
volumes:
  postgres_data:
